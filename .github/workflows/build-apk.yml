name: Compilar APK SoundAlive Lite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p output_apk
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} output_apk/SoundAlive-Lite.apk \;

      - name: Subir APK SoundAlive Lite
        uses: actions/upload-artifact@v4
        with:
          name: SoundAlive-Lite
          path: output_apk/SoundAlive-Lite.apk
