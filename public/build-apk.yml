name: Compilar APK SoundAlive Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17 (LTS)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew clean --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p output_apk
          find android/app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" -exec cp {} output_apk/SoundAlive-Pro.apk \;
          if [ ! -f output_apk/SoundAlive-Pro.apk ]; then
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/SoundAlive-Pro.apk \;
          fi

      - name: Subir APK SoundAlive Pro
        uses: actions/upload-artifact@v4
        with:
          name: SoundAlive-Pro
          path: output_apk/SoundAlive-Pro.apk
