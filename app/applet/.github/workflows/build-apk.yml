name: Compilar APK SoundAlive Lite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..
          mkdir -p output_apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/SoundAlive-Lite.apk \;

      - name: Subir APK SoundAlive Lite
        uses: actions/upload-artifact@v4
        with:
          name: SoundAlive-Lite
          path: output_apk/SoundAlive-Lite.apk
